# =============================================================================
# Release automático — CobroFacil POS (TPV Pro 2026)
# Repositorio: https://github.com/cesarmaciel1234/cobrofacil-releases
# Descarga permanente: https://github.com/cesarmaciel1234/cobrofacil-releases/releases/latest
# Se dispara en cada push a main (o manualmente desde Actions).
# =============================================================================

name: Build y Release Windows

on:
  push:
    branches:
      - main   # Solo main: un camino adelante, sin releases desde ramas viejas
  workflow_dispatch:   # Permite lanzar el build desde GitHub → Actions → Run workflow

permissions:
  contents: write   # Necesario para crear Releases y subir assets

jobs:
  build-and-release:
    # Evitar re-release por merges spam / commits de bot con [skip ci]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, 'token-check')
      )
    runs-on: windows-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Clonar el repositorio
      # -----------------------------------------------------------------------
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Configurar Python
      # -----------------------------------------------------------------------
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # -----------------------------------------------------------------------
      # 3. Instalar dependencias del proyecto + PyInstaller
      # -----------------------------------------------------------------------
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Preparar version de release
        id: version
        shell: pwsh
        run: |
          $path = "version.json"
          $data = Get-Content $path -Raw | ConvertFrom-Json
          $data.build_date = (Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          $data | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8
          echo "tag=v$($data.app_version)" >> $env:GITHUB_OUTPUT
          echo "app_version=$($data.app_version)" >> $env:GITHUB_OUTPUT

      - name: Generar iconos del clima
        run: |
          python src/carteleria/lanzador_tv/generar_iconos_clima.py

      # -----------------------------------------------------------------------
      # 4. Compilar main.py → dist/CobroFacil_POS/CobroFacil_POS.exe
      #    (--onedir: carpeta con el .exe y librerías; mismo criterio que Compilar_Todo.bat)
      # -----------------------------------------------------------------------
      - name: Verificar datos PyInstaller (--add-data)
        shell: pwsh
        run: |
          # Solo rutas que existen en el repo y se pasan a --add-data.
          # NO exigir src/styles.qss ni src/icon.png: no están en el árbol fuente.
          $required = @(
            'src/ui_components',
            'src/assets',
            'src/assets/pos_icon.png',
            'src/carteleria/assets',
            'src/carteleria/lanzador_tv/la_cara_web/index.html',
            'src/carteleria/lanzador_tv/la_cara_web/assets',
            'src/carteleria/creador_png/templates',
            'src/carteleria/creador_png/static',
            'Catalogos'
          )
          $missing = @()
          foreach ($p in $required) {
            if (-not (Test-Path $p)) {
              Write-Host "FALTA: $p"
              $missing += $p
            } else {
              Write-Host "OK: $p"
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Archivos requeridos faltantes: $($missing -join ', ')"
            exit 1
          }

      - name: Empaquetar cara web TV (blob oculto)
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          python src/carteleria/lanzador_tv/tv_cara_pack.py pack build/tv_cara.bin
          if (-not (Test-Path "build/tv_cara.bin")) { Write-Error "Fallo pack TV"; exit 1 }

      - name: Compilar ejecutable con PyInstaller
        env:
          TPV_QT: "6"
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name "CobroFacil_POS" `
            --exclude-module "PyQt5" `
            --exclude-module "tkinter" `
            --exclude-module "tcl" `
            --exclude-module "_tkinter" `
            --exclude-module "Tkinter" `
            --exclude-module "rembg" `
            --exclude-module "scipy" `
            --exclude-module "src.carteleria.creador_png.convertir_imagen" `
            --hidden-import "reportlab.graphics.barcode.code93" `
            --hidden-import "reportlab.graphics.barcode.code128" `
            --hidden-import "reportlab.graphics.barcode.code39" `
            --hidden-import "reportlab.graphics.barcode.eanbc" `
            --hidden-import "src.cajero.paso5_terminal.componentes_paso5_terminal.componentes_barra_inferior.chatbot.chat_bot" `
            --hidden-import "lxml" `
            --hidden-import "html5lib" `
            --hidden-import "openpyxl" `
            --hidden-import "win32com" `
            --hidden-import "win32com.client" `
            --hidden-import "PyQt6.QtWebEngineWidgets" `
            --hidden-import "PyQt6.QtWebEngineCore" `
            --collect-all "PyQt6.QtWebEngineCore" `
            --collect-all "PyQt6.QtWebEngineWidgets" `
            --collect-submodules "src.admin" `
            --collect-submodules "src.jefe" `
            --collect-submodules "src.cajero" `
            --collect-submodules "src.carteleria" `
            --collect-submodules "src.motor_descuentos" `
            --hidden-import "src.motor_descuentos.vistas.dialog_gestor_publicidad" `
            --hidden-import "src.motor_descuentos.vistas.ofertas_main" `
            --hidden-import "src.carteleria.creador_png.app" `
            --hidden-import "src.carteleria.creador_png.servidor" `
            --hidden-import "flask" `
            --hidden-import "jinja2" `
            --hidden-import "werkzeug" `
            --copy-metadata "werkzeug" `
            --copy-metadata "flask" `
            --copy-metadata "jinja2" `
            --copy-metadata "markupsafe" `
            --copy-metadata "itsdangerous" `
            --copy-metadata "blinker" `
            --copy-metadata "click" `
            --collect-all "flask" `
            --collect-all "werkzeug" `
            --runtime-hook "01_Compiladores_y_Ejecutables/rthooks/pyi_rth_qt_dll_path.py" `
            --runtime-hook "01_Compiladores_y_Ejecutables/rthooks/pyi_rth_pkg_metadata.py" `
            --collect-submodules "src.services" `
            --collect-submodules "src.utils" `
            --collect-submodules "src.base_de_datos" `
            --collect-submodules "src.inicio_y_perfiles" `
            --collect-submodules "src.central_red_global" `
            --collect-submodules "src.ui_global" `
            --add-data "src/ui_components;src/ui_components" `
            --add-data "src/assets;src/assets" `
            --add-data "src/carteleria/assets;src/carteleria/assets" `
            --add-data "build/tv_cara.bin;tv_cara.bin" `
            --add-data "src/carteleria/creador_png/templates;src/carteleria/creador_png/templates" `
            --add-data "src/carteleria/creador_png/static;src/carteleria/creador_png/static" `
            --add-data "Catalogos;Catalogos" `
            main.py

      - name: Instalar dependencias del Worker (rembg)
        run: |
          pip install rembg onnxruntime pooch scikit-image

      - name: Compilar Worker de Creador PNG
        env:
          TPV_QT: "6"
        run: |
          python -m PyInstaller --noconfirm --onedir --console --name "Creador_PNG_Worker" `
            --hidden-import "rembg" `
            --collect-all "rembg" `
            --collect-all "onnxruntime" `
            --collect-all "pooch" `
            src/carteleria/creador_png/convertir_imagen.py

      - name: Integrar Worker al paquete principal
        shell: pwsh
        run: |
          Move-Item -Path "dist/Creador_PNG_Worker" -Destination "dist/CobroFacil_POS/worker" -Force

        - name: Asegurar cara web TV oculta en el paquete
          shell: pwsh
          run: |
            New-Item -ItemType Directory -Force -Path "dist/CobroFacil_POS/_internal" | Out-Null
            if (Test-Path "build/tv_cara.bin") {
              Copy-Item -Force "build/tv_cara.bin" "dist/CobroFacil_POS/_internal/tv_cara.bin"
            } else {
              python src/carteleria/lanzador_tv/tv_cara_pack.py pack "dist/CobroFacil_POS/_internal/tv_cara.bin"
            }
            if (-not (Test-Path "dist/CobroFacil_POS/_internal/tv_cara.bin")) {
              Write-Error "Falta tv_cara.bin en el paquete"
              exit 1
            }
            if (Test-Path "dist/CobroFacil_POS/src") {
                Remove-Item -Recurse -Force "dist/CobroFacil_POS/src" -ErrorAction SilentlyContinue
            }
            Get-ChildItem -Path dist/CobroFacil_POS -Recurse -Directory -Filter la_cara_web -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "OK cara web TV oculta (tv_cara.bin)"
        - name: Copiar version.json y launcher autnomo
        shell: pwsh
        run: |
          Copy-Item version.json dist/CobroFacil_POS/version.json
          Copy-Item CobroFacil_Start.bat dist/CobroFacil_POS/CobroFacil_Start.bat -Force
          Write-Host "Launcher CobroFacil_Start.bat incluido en el paquete"

      # -----------------------------------------------------------------------
      # 4b. MariaDB portable + ZIP del release (POS + mariadb_server)
      # -----------------------------------------------------------------------
      - name: Preparar MariaDB portable
        run: python 01_Compiladores_y_Ejecutables/prepare_mariadb_release.py

      - name: Configurar y validar reporte automático de errores
        shell: pwsh
        env:
          REPORT_TOKEN: ${{ secrets.COBROFACIL_ERROR_REPORT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:REPORT_TOKEN)) {
            Write-Error "Falta secret COBROFACIL_ERROR_REPORT_TOKEN."
            exit 1
          }
          @'
          import json, os, urllib.request, urllib.error, sys
          tok = os.environ["REPORT_TOKEN"].strip()
          repo = "cesarmaciel1234/cobrofacil-releases"
          path = "dist/CobroFacil_POS/error_report.json"
          with open(path, "w", encoding="utf-8") as f:
              json.dump({"token": tok, "repo": repo}, f, ensure_ascii=False)
          print(f"error_report.json ok len={len(tok)}")

          def post(url, payload):
              data = json.dumps(payload).encode()
              req = urllib.request.Request(
                  url, data=data, method="POST",
                  headers={
                      "Authorization": f"Bearer {tok}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "User-Agent": "CobroFacil-release-check",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          # NO usar label auto-report ni pos-client-error: eso disparaba auto-fix → PR → release (bucle).
          # Validar escritura sin labels; cerrar al instante.
          st, body = post(
              f"https://api.github.com/repos/{repo}/issues",
              {
                  "title": "[ci] token-check (cerrar)",
                  "body": "Validacion interna del secret. No es un bug de cliente.",
              },
          )
          if 200 <= st < 300:
              issue = json.loads(body.decode())
              num = issue.get("number")
              print(f"token OK via issues API #{num}")
              if num:
                  post(f"https://api.github.com/repos/{repo}/issues/{num}", {"state": "closed"})
              sys.exit(0)
          print("issues API", st, body[:300])
          # Dispatch silencioso (sin workflow que abra Issues)
          st2, body2 = post(
              f"https://api.github.com/repos/{repo}/dispatches",
              {"event_type": "ci-token-check", "client_payload": {"ok": True}},
          )
          if st2 in (204, 200):
              print("token OK via repository_dispatch (ci-token-check)")
              sys.exit(0)
          print("dispatch", st2, body2[:300])
          sys.exit(
              "Secret COBROFACIL_ERROR_REPORT_TOKEN sin permiso. "
              "PAT classic scope repo, o fine-grained Issues:write (+ Contents:write para dispatch)."
          )
          '@ | Set-Content -Path _check_report_token.py -Encoding utf8
          python _check_report_token.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Empaquetar release (.zip)
        run: python 01_Compiladores_y_Ejecutables/package_release_zip.py

      # -----------------------------------------------------------------------
      # 5. Crear Release en GitHub (tag por versión; /releases/latest apunta al más nuevo)
      # -----------------------------------------------------------------------
      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CobroFacil POS ${{ steps.version.outputs.app_version }}
          body: |
            Build automático — [cobrofacil-releases](https://github.com/cesarmaciel1234/cobrofacil-releases)
            - Versión: ${{ steps.version.outputs.app_version }}
            - Commit: ${{ github.sha }}
            - Workflow: ${{ github.run_id }}
            - Descargar **CobroFacil_POS_Release.zip**, descomprimir y ejecutar `CobroFacil_POS.exe`.
            - Enlace: https://github.com/cesarmaciel1234/cobrofacil-releases/releases/latest
          files: dist/CobroFacil_POS_Release.zip
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false

      - name: Verificar que el ZIP quedó publicado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          COUNT=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets | length')
          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: el release $TAG no tiene assets adjuntos"
            exit 1
          fi
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name'



